<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Dominio Coffee</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .carta {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Contenedor Flexbox para la galería */
        .galeria-carta {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        
        .imagen-carta {
            flex: 1 1 45%;
            min-width: 280px;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            cursor: pointer; /* Indica que la imagen se puede clicar */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Efecto leve al pasar el cursor (Hover) */
        .imagen-carta:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        /* Estilo para que la imagen sea totalmente responsiva */
        .imagen-carta img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* --- ESTILOS DEL ZOOM (LIGHTBOX MODAL) --- */
        .lightbox-modal {
            display: none; /* Oculto por defecto */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px); /* Desenfoca levemente el fondo */
        }

        .lightbox-modal.activo {
            display: flex; /* Se activa con JS */
        }

        .lightbox-imagen {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            object-fit: contain;
            animation: zoomAnimation 0.25s ease-out;
        }

        /* Animación suave de entrada */
        @keyframes zoomAnimation {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Botón para cerrar */
        .cerrar-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

    <section class="carta">
        <div class="galeria-carta">
            <div class="imagen-carta">
                <img src="img.01.jpeg" class="img-01jpg" alt="Carta primaria">
            </div>
            <div class="imagen-carta">
                <img src="img.2.jpeg" class="img-02jpg" alt="Carta Secundaria">
            </div>
        </div>
    </section>

    <!-- Modal para el Zoom -->
    <div class="lightbox-modal" id="lightbox">
        <span class="cerrar-lightbox" id="cerrarBtn">&times;</span>
        <img class="lightbox-imagen" id="lightboxImg" alt="Imagen ampliada">
    </div>

    <!-- Script de interacción -->
    <script>
        const imagenes = document.querySelectorAll('.imagen-carta img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const cerrarBtn = document.getElementById('cerrarBtn');

        // Abrir la imagen en grande al hacer clic
        imagenes.forEach(imagen => {
            imagen.addEventListener('click', () => {
                lightboxImg.src = imagen.src;
                lightboxImg.alt = imagen.alt;
                lightbox.classList.add('activo');
            });
        });

        // Cerrar al hacer clic en la "X" o fuera de la imagen
        const cerrarLightbox = () => lightbox.classList.remove('activo');
        cerrarBtn.addEventListener('click', cerrarLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) cerrarLightbox();
        });

        // Cerrar con la tecla Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') cerrarLightbox();
        });
    </script>

</body>
</html>
